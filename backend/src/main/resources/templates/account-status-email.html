<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Account Status Notification</title>
    <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      padding: 20px;
    }
    .email-container {
      background-color: white;
      padding: 30px;
      border-radius: 8px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .header {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      margin-bottom: 20px;
    }
    .status {
      font-weight: bold;
      color: #ffffff;
      background-color: #28a745;
      padding: 6px 12px;
      border-radius: 4px;
      display: inline-block;
    }
    .status.disabled {
      background-color: #dc3545;
    }
    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
<div class="email-container">
    <div class="header">Hello <span th:text="${name}"></span>,</div>

    <p>Your account has been
        <span th:class="'status ' + (${status} == 'disabled' ? 'disabled' : '')"
              th:text="${status}"></span>.
    </p>

    <p>If you believe this was a mistake or have any concerns, please contact our support team.</p>

    <div class="footer">
        &copy; 2025 ElderCare. All rights reserved.
    </div>
</div>
</body>
</html>
