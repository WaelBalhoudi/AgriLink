<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>License Number</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      padding: 20px;
    }
    .email-container {
      background-color: white;
      padding: 30px;
      border-radius: 8px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .header {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      margin-bottom: 20px;
    }
    h1{
            font-size: 36px;
            font-weight: bold;
            color: #5272FF;
            background-color: #f0f8f0;
            padding: 15px;
            border-radius: 5px;
            display: inline-block;
            width: 100%;
            text-align: center;
            margin: 20px 0;
        }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
<div class="email-container">
  <div class="header">Hello Dr. <span th:text="${name}"></span>,</div>
  <p>You can use this License Number to register to our platform.</p>
  <h1 th:text="${licenseNumber}"></h1>
  <div class="footer">
    &copy; 2025 ElderCare. All rights reserved.
  </div>
</div>
</body>
</html>
