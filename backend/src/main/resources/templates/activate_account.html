<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}"></title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 600px;
            margin: 10px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .activation-code {
            font-size: 36px;
            text-align: center;
            margin-bottom: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            border-radius: 5px;
        }

    </style>
</head>
<body>
<div class="container">
    <h1 style="text-align:center">Activate Your Account</h1>
    <p class="greeting" th:text="'Hi ' + ${username} + ','"></p>
    <p>
        For your security, please use the verification code below to complete your authentication process.
    </p>
    <p>
        This step ensures your account is protected and only accessible by you.
    </p>
    <div class="activation-code">
        <strong>Verification Code:</strong>
        <strong th:text="${activation_code}"></strong>
    </div>
    <p>
        If you did not request this code, please ignore this message or contact support.
    </p>
</div>

</body>
</html>
