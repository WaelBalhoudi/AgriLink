<section id="hero" class="hero section dark-background">

  <div class="info d-flex align-items-center">
    <div class="container">
      <div class="row justify-content-center" data-aos="fade-up" data-aos-delay="100">
        <div class="col-lg-6 text-center">

          <h2>Smart Farming Starts Here</h2>

          <p>
            Detect crop diseases with AI, sell your agricultural products,
            and connect with buyers across Tunisia. AgriLink helps farmers
            grow smarter and sell faster.
          </p>

          <div class="hero-buttons">

            <button class="btn-form primary-btn-form" (click)="openCamera()">
              Detect Plant Disease
            </button>

            <input 
              type="file"
              #fileInput
              accept="image/*"
              capture="environment"
              (change)="onFileSelected($event)"
              hidden
            />

            <a routerLink="/marketplace" class="btn-form">
              Explore Marketplace
            </a>

          </div>

        </div>
      </div>
    </div>
  </div>

  <div id="hero-carousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="5000">

    <div class="carousel-item">
      <img loading="lazy" src="assets/img/hero-carousel/1.png" alt="Farmer working in field">
    </div>

    <div class="carousel-item">
      <img loading="lazy" src="assets/img/hero-carousel/2.png" alt="Agriculture crops">
    </div>

    <div class="carousel-item">
      <img loading="lazy" src="assets/img/hero-carousel/3.png" alt="Farmer harvesting">
    </div>

    <div class="carousel-item">
      <img loading="lazy" src="assets/img/hero-carousel/4.png" alt="Farm vegetables">
    </div>

    <div class="carousel-item active">
      <img loading="lazy" src="assets/img/hero-carousel/5.png" alt="Agriculture market">
    </div>

    <!-- Previous Button - Hidden on mobile, Font Awesome icon -->
    <a class="carousel-control-prev d-none d-md-flex" href="#hero-carousel" role="button" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true">
        <i class="fa-solid fa-chevron-left" style="font-size: 2rem;"></i>
      </span>
      <span class="visually-hidden">Previous</span>
    </a>

    <!-- Next Button - Hidden on mobile, Font Awesome icon -->
    <a class="carousel-control-next d-none d-md-flex" href="#hero-carousel" role="button" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true">
        <i class="fa-solid fa-chevron-right" style="font-size: 2rem;"></i>
      </span>
      <span class="visually-hidden">Next</span>
    </a>

  </div>

</section>

<section style="height: 500px; width: 100%; border: 1px solid red;">
</section>
